name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          brew install create-dmg
          swift --version

      - uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ github.repository }}-${{ hashFiles('Package.swift', 'Package.resolved') }}

      # AIDEV-NOTE: macOS ProgressView (NSProgressIndicator) crashed 0.2.4 during layout; use Spinner (Theme.swift).
      - name: No ProgressView
        run: |
          if grep -rn --include='*.swift' 'ProgressView(' Sources/HermesMac | grep -v 'Theme.swift'; then
            echo "::error title=ProgressView::Use Spinner instead (crash fix, see Theme.swift)"; exit 1; fi

      # Unit checks only: live API checks skip themselves without dev/hermes-home/.env.
      - name: Checks
        run: swift run hermes-checks

      - name: Build app
        run: BUILD=${{ github.run_number }} ./scripts/build.sh

      - name: Package (unsigned smoke test)
        run: ./scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Alaria-unsigned-${{ github.run_number }}
          path: build/dist/*
          retention-days: 7
